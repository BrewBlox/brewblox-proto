syntax = "proto3";

import "brewblox.proto";
import "nanopb.proto";

package blox.PressureSensor;

enum PressureSensorType {
  PRESSURE_SENSOR_TYPE_NOT_SET = 0;
  PRESSURE_SENSOR_TYPE_GAUGE_ABSOLUTE = 1;
  PRESSURE_SENSOR_TYPE_GAUGE_RELATIVE = 2;

}

message Block {
  option (brewblox.msg).objtype = PressureSensor;
  option (brewblox.msg).impl = AnalogClaimerInterface;

  PressureSensorType type = 1;
  uint32 analogDevice = 2 [
    (brewblox.field).objtype = GpioModule,
    (brewblox.field).stored = true
  ];

  uint32 analogChannel = 3 [ (nanopb).int_size = IS_8 ];

  sint32 raw = 4 [
    (brewblox.field).scale = 262144,
    (brewblox.field).logged = true,
    (brewblox.field).readonly = true
  ];
  sint32 resistance = 5 [
    (brewblox.field).scale = 16384,
    (brewblox.field).logged = true,
    (brewblox.field).readonly = true,
    (brewblox.field).unit = Ohm
  ];
  sint32 pressureAbsolute = 6 [
    (brewblox.field).scale = 4096,
    (brewblox.field).logged = true,
    (brewblox.field).readonly = true,
    (brewblox.field).unit = MilliBar
  ];
  sint32 pressureRelative = 7 [
    (brewblox.field).scale = 4096,
    (brewblox.field).logged = true,
    (brewblox.field).readonly = true,
    (brewblox.field).unit = MilliBar
  ];

  // Legendre temperature correction model
  sint32 referenceResistance = 8 [
    (brewblox.field).scale = 16384,
    (brewblox.field).unit = Ohm,
    (brewblox.field).stored = true
  ];
  sint32 rMin = 9 [
    (brewblox.field).scale = 16384,
    (brewblox.field).unit = Ohm,
    (brewblox.field).stored = true
  ];
  sint32 rMax = 10 [
    (brewblox.field).scale = 16384,
    (brewblox.field).unit = Ohm,
    (brewblox.field).stored = true
  ];
  sint32 offsetO0 = 11 [
    (brewblox.field).scale = 1048576,
    (brewblox.field).stored = true
  ];
  sint32 offsetO1 = 12 [
    (brewblox.field).scale = 1048576,
    (brewblox.field).stored = true
  ];
  sint32 offsetO2 = 13 [
    (brewblox.field).scale = 1048576,
    (brewblox.field).stored = true
  ];
  sint32 gainS0 = 14 [
    (brewblox.field).scale = 1048576,
    (brewblox.field).stored = true
  ];
  sint32 gainS1 = 15 [
    (brewblox.field).scale = 1048576,
    (brewblox.field).stored = true
  ];
  sint32 gainS2 = 16 [
    (brewblox.field).scale = 1048576,
    (brewblox.field).stored = true
  ];
  sint32 internalPressure = 17 [
    (brewblox.field).scale = 4096,
    (brewblox.field).unit = MilliBar,
    (brewblox.field).stored = true
  ];
}
