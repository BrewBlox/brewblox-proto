syntax = "proto3";

import "brewblox.proto";
import "nanopb.proto";
import "GpioModule.proto";

package blox.OneWireGpioModule;

message Block {
  option (brewblox.msg).objtype = OneWireGpioModule;
  option (brewblox.msg).impl = IoArrayInterface;
  option (brewblox.msg).impl = OneWireBusInterface;

  repeated GpioModule.Channel channels = 1
      [ (brewblox.field).stored = true, (nanopb).max_count = 8 ];
  uint32 modulePosition = 2
      [ (brewblox.field).stored = true, (nanopb).int_size = IS_8 ];
  bool useExternalPower = 14 [ (brewblox.field).stored = true ];
  GpioModule.Status status = 17 [ (brewblox.field).readonly = true ];

  // Deprecated fields
  uint32 moduleStatus = 3
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 pullUpDesired = 4
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 PullUpStatus = 5
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 PullUpWhenActive = 6
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 PullUpWhenInactive = 7
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 pullDownDesired = 8
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 PullDownStatus = 9
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 PullDownWhenActive = 10
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 PullDownWhenInactive = 11
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 overCurrent = 12
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 openLoad = 13
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 faultsHistory5m = 15
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  uint32 faultsHistory60m = 16
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  // fault clearing is now automatic, but we keep the ignored fields for
  // backwards compatibility
  uint32 moduleStatusClear = 90
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
  bool clearFaults = 32
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
}
