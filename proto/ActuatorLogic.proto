syntax = "proto3";

import "brewblox.proto";
import "nanopb.proto";
import "IoArray.proto";

package blox.ActuatorLogic;

enum Result {
  RESULT_FALSE = 0;
  RESULT_TRUE = 1;
  RESULT_EMPTY = 2;
  RESULT_EMPTY_SUBSTRING = 3;
  RESULT_BLOCK_NOT_FOUND = 4;
  RESULT_INVALID_DIGITAL_OP = 5;
  RESULT_INVALID_ANALOG_OP = 6;
  RESULT_UNDEFINED_DIGITAL_COMPARE = 8;
  RESULT_UNDEFINED_ANALOG_COMPARE = 7;
  RESULT_UNEXPECTED_OPEN_BRACKET = 11;
  RESULT_UNEXPECTED_CLOSE_BRACKET = 9;
  RESULT_UNEXPECTED_CHARACTER = 12;
  RESULT_UNEXPECTED_COMPARISON = 13;
  RESULT_UNEXPECTED_OPERATOR = 14;
  RESULT_MISSING_CLOSE_BRACKET = 10;
}

enum DigitalOperator {
  OP_VALUE_IS = 0;
  OP_VALUE_IS_NOT = 1;
  OP_DESIRED_IS = 10;
  OP_DESIRED_IS_NOT = 11;
};

enum AnalogOperator {
  OP_VALUE_LE = 0;
  OP_VALUE_GE = 1;
  OP_SETTING_LE = 10;
  OP_SETTING_GE = 11;
};

message DigitalCompare {
  DigitalOperator op = 1 [ (brewblox.field).stored = true ];
  Result result = 2 [ (brewblox.field).readonly = true ];
  uint32 id = 3 [
    (brewblox.field).objtype = DigitalInterface,
    (brewblox.field).stored = true
  ];
  IoArray.DigitalState rhs = 4 [ (brewblox.field).stored = true ];
};

message AnalogCompare {
  AnalogOperator op = 1 [ (brewblox.field).stored = true ];
  Result result = 2 [ (brewblox.field).readonly = true ];
  uint32 id = 3 [
    (brewblox.field).objtype = ProcessValueInterface,
    (brewblox.field).stored = true
  ];
  sint32 rhs = 4 [
    (brewblox.field).scale = 4096,
    (brewblox.field).stored = true,
    (nanopb).int_size = IS_32
  ];
};

message DigitalCompareList {
  repeated DigitalCompare items = 1
      [ (brewblox.field).stored = true, (nanopb).max_count = 16 ];
}

message AnalogCompareList {
  repeated AnalogCompare items = 1
      [ (brewblox.field).stored = true, (nanopb).max_count = 16 ];
}

message Block {
  option (brewblox.msg).objtype = ActuatorLogic;
  option (brewblox.msg).impl = EnablerInterface;

  optional uint32 targetId = 1 [
    (brewblox.field).objtype = ActuatorDigitalInterface,
    (brewblox.field).stored = true
  ];
  optional bool enabled = 3 [ (brewblox.field).stored = true ];
  Result result = 4
      [ (brewblox.field).logged = true, (brewblox.field).readonly = true ];
  // a-zA-Z&|^!()
  optional string expression = 5
      [ (brewblox.field).stored = true, (nanopb).max_length = 64 ];
  // Read at load only: blobs from before the wrappers.
  repeated DigitalCompare digitalLegacy = 6
      [ (brewblox.field).ignored = true, (nanopb).type = FT_CALLBACK ];
  repeated AnalogCompare analogLegacy = 7
      [ (brewblox.field).ignored = true, (nanopb).type = FT_CALLBACK ];
  // a-z
  DigitalCompareList digital = 9 [ (brewblox.field).stored = true ];
  // A-Z
  AnalogCompareList analog = 10 [ (brewblox.field).stored = true ];
  uint32 errorPos = 8
      [ (brewblox.field).readonly = true, (nanopb).int_size = IS_8 ];

  // Deprecated field
  bool drivenTargetId = 90
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
}
