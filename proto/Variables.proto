syntax = "proto3";

import "brewblox.proto";
import "nanopb.proto";
import "IoArray.proto";

package blox.Variables;

message VarContainer {
  oneof var {
    bool empty = 1;

    IoArray.DigitalState digital = 10 [ (brewblox.field).stored = true ];
    sint32 analog = 11 [
      (brewblox.field).scale = 4096,
      (brewblox.field).stored = true,
      (nanopb).int_size = IS_32
    ];

    sint32 temp = 20 [
      (brewblox.field).unit = Celsius,
      (brewblox.field).scale = 4096,
      (brewblox.field).stored = true,
      (nanopb).int_size = IS_32
    ];
    sint32 deltaTemp = 21 [
      (brewblox.field).unit = DeltaCelsius,
      (brewblox.field).scale = 4096,
      (brewblox.field).stored = true,
      (nanopb).int_size = IS_32
    ];

    uint32 timestamp = 30 [
      (brewblox.field).datetime = true,
      (brewblox.field).stored = true,
      (nanopb).int_size = IS_32
    ];
    uint32 duration = 31 [
      (brewblox.field).unit = Second,
      (brewblox.field).stored = true,
      (nanopb).int_size = IS_32
    ];

    uint32 link = 40
        [ (brewblox.field).objtype = Any, (brewblox.field).stored = true ];
  }
}

message Block {
  option (brewblox.msg).objtype = Variables;

  map<string, VarContainer> variables = 1 [ (brewblox.field).stored = true ];
}
