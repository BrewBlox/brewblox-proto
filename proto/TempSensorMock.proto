syntax = "proto3";

import "brewblox.proto";
import "nanopb.proto";

package blox.TempSensorMock;

message Fluctuation {
  sint32 amplitude = 1 [
    (brewblox.field).unit = DeltaCelsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).stored = true,
    (nanopb).int_size = IS_32
  ];
  uint32 period = 2 [
    (brewblox.field).unit = Second,
    (brewblox.field).scale = 1000,
    (brewblox.field).stored = true,
    (nanopb).int_size = IS_32
  ];
};

message FluctuationList {
  repeated Fluctuation items = 1 [ (brewblox.field).stored = true ];
}

message Block {
  option (brewblox.msg).objtype = TempSensorMock;
  option (brewblox.msg).impl = TempSensorInterface;

  optional sint32 value = 1 [
    (brewblox.field).unit = Celsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).logged = true,
    (brewblox.field).logged_decimals = 3,
    (brewblox.field).readonly = true,
    (nanopb).int_size = IS_32
  ];
  optional bool connected = 3
      [ (brewblox.field).stored = true, (brewblox.field).logged = true ];

  optional sint32 setting = 4 [
    (brewblox.field).unit = Celsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).stored = true,
    (nanopb).int_size = IS_32
  ];

  // Read at load only: blobs from before the wrapper.
  repeated Fluctuation fluctuationsLegacy = 5
      [ (brewblox.field).ignored = true ];
  FluctuationList fluctuations = 6 [ (brewblox.field).stored = true ];
}
