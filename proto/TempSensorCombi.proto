syntax = "proto3";

import "brewblox.proto";
import "nanopb.proto";

package blox.TempSensorCombi;

enum SensorCombiFunc {
  SENSOR_COMBI_FUNC_AVG = 0;
  SENSOR_COMBI_FUNC_MIN = 1;
  SENSOR_COMBI_FUNC_MAX = 2;
}

message SensorList {
  repeated uint32 items = 1 [
    (brewblox.field).objtype = TempSensorInterface,
    (brewblox.field).stored = true,
    (nanopb).max_count = 8
  ];
}

message Block {
  option (brewblox.msg).objtype = TempSensorCombi;
  option (brewblox.msg).impl = TempSensorInterface;

  optional sint32 value = 1 [
    (brewblox.field).unit = Celsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).logged = true,
    (brewblox.field).readonly = true,
    (nanopb).int_size = IS_32
  ];

  optional SensorCombiFunc combineFunc = 2 [ (brewblox.field).stored = true ];

  // Read at load only: blobs from before the wrapper.
  repeated uint32 sensorsLegacy = 3 [
    (brewblox.field).objtype = TempSensorInterface,
    (brewblox.field).ignored = true,
    (nanopb).type = FT_CALLBACK
  ];
  SensorList sensors = 4 [ (brewblox.field).stored = true ];
}
