syntax = "proto3";

import "brewblox.proto";
import "nanopb.proto";
import "Claims.proto";

package blox.SetpointSensorPair;

enum FilterChoice {
  option allow_alias = true;
  FILTER_NONE = 0;
  SETTLE_IN_13_SAMPLES = 1;
  SETTLE_IN_47_SAMPLES = 2;
  SETTLE_IN_112_SAMPLES = 3;
  SETTLE_IN_241_SAMPLES = 4;
  SETTLE_IN_649_SAMPLES = 5;
  SETTLE_IN_1876_SAMPLES = 6;
  // Deprecated: named after approximate step response time at 1s sample rate
  FILTER_15s = 1;
  FILTER_45s = 2;
  FILTER_90s = 3;
  FILTER_3m = 4;
  FILTER_10m = 5;
  FILTER_30m = 6;
}

message Block {
  option (brewblox.msg).objtype = SetpointSensorPair;
  option (brewblox.msg).impl = ProcessValueInterface;
  option (brewblox.msg).impl = StoredSetpointInterface;
  option (brewblox.msg).impl = SetpointSensorPairInterface;
  option (brewblox.msg).impl = EnablerInterface;
  option (brewblox.msg).impl = ClaimableInterface;

  bool enabled = 7 [ (brewblox.field).stored = true ];

  uint32 sensorId = 2 [
    (brewblox.field).objtype = TempSensorInterface,
    (brewblox.field).stored = true
  ];

  sint32 storedSetting = 8 [
    (brewblox.field).unit = Celsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).stored = true,
    (brewblox.field).logged = true,
    (nanopb).int_size = IS_32
  ];

  sint32 desiredSetting = 15 [
    (brewblox.field).unit = Celsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).logged = true,
    (brewblox.field).readonly = true,
    (nanopb).int_size = IS_32
  ];
  sint32 setting = 5 [
    (brewblox.field).unit = Celsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).logged = true,
    (brewblox.field).readonly = true,
    (nanopb).int_size = IS_32
  ];
  sint32 value = 6 [
    (brewblox.field).unit = Celsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).logged = true,
    (brewblox.field).readonly = true,
    (nanopb).int_size = IS_32
  ];
  sint32 valueUnfiltered = 11 [
    (brewblox.field).unit = Celsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).logged = true,
    (brewblox.field).readonly = true,
    (nanopb).int_size = IS_32
  ];

  FilterChoice filter = 9 [ (brewblox.field).stored = true ];
  sint32 filterThreshold = 10 [
    (brewblox.field).unit = DeltaCelsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).stored = true,
    (nanopb).int_size = IS_32
  ];

  bool resetFilter = 12;

  uint32 claimedBy = 13
      [ (brewblox.field).objtype = Any, (brewblox.field).readonly = true ];
  Claims.SettingMode settingMode = 14 [ (brewblox.field).stored = true ];

  bool rampLimitEnabled = 16 [ (brewblox.field).stored = true];

  uint32 rampLimit = 17 [
    (brewblox.field).unit = DeltaCelsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).stored = true,
    (nanopb).int_size = IS_32
  ];

  uint32 rampDuration = 18 [
    (brewblox.field).unit = Second,
    (brewblox.field).stored = true,
    (nanopb).int_size = IS_32
  ];

  // Renamed field
  bool settingEnabled = 90
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
}
