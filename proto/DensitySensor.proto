syntax = "proto3";

import "brewblox.proto";

package blox.DensitySensor;

enum DensitySensorMode {
  DENSITY_SENSOR_MODE_DENSITY = 0;   // the liquid in the tube is still and its reading steady: SG and density
  DENSITY_SENSOR_MODE_FLOW = 1;      // a pump moves it: flow rate, no SG or density
  DENSITY_SENSOR_MODE_LOW_LEVEL = 2; // the liquid is below the upper sensor: none of them
  DENSITY_SENSOR_MODE_SETTLING = 3;  // still, but the reading has not held steady yet, as after a pump stop, a fast level change or another mode: no SG or density yet
  DENSITY_SENSOR_MODE_ERROR = 4;     // it reads nothing: a pressure sensor or its reading is missing, or, with liquid over the upper sensor, a temperature, gravity or the separation
}

message Block {
  option (brewblox.msg).objtype = DensitySensor;
  option (brewblox.msg).impl = DensitySensorInterface;

  // References (stored)
  optional uint32 upperPressure = 1 [
    (brewblox.field).objtype = PressureSensor,
    (brewblox.field).stored = true
  ];
  optional uint32 lowerPressure = 2 [
    (brewblox.field).objtype = PressureSensor,
    (brewblox.field).stored = true
  ];
  // 3: a tube temperature sensor, now the pressure sensors' own temperature
  reserved 3;

  // Settings (stored)
  optional sint32 sensorSeparation = 4 [
    (brewblox.field).scale = 1024,
    (brewblox.field).unit = Millimeter,
    (brewblox.field).stored = true
  ];
  optional sint32 gravity = 5 [
    (brewblox.field).scale = 65536,
    (brewblox.field).stored = true
  ];
  optional sint32 flowCoefficient = 6 [
    (brewblox.field).scale = 4096,
    (brewblox.field).stored = true
  ];
  // 7: a flow threshold, now fixed in the firmware
  reserved 7;

  // Outputs (readonly, logged)

  // In density mode only
  optional sint32 specificGravity = 10 [
    (brewblox.field).scale = 1048576,
    (brewblox.field).readonly = true,
    (brewblox.field).logged = true
  ];
  optional sint32 differentialPressure = 11 [
    (brewblox.field).scale = 4096,
    (brewblox.field).unit = MilliBar,
    (brewblox.field).readonly = true,
    (brewblox.field).logged = true
  ];
  // In flow mode only; positive with the pump in its normal direction
  optional sint32 flowRate = 12 [
    (brewblox.field).scale = 65536,
    (brewblox.field).unit = LiterPerMinute,
    (brewblox.field).readonly = true,
    (brewblox.field).logged = true
  ];
  // In density mode only
  optional sint32 density = 14 [
    (brewblox.field).scale = 4096,
    (brewblox.field).unit = GramPerLiter,
    (brewblox.field).readonly = true,
    (brewblox.field).logged = true
  ];
  DensitySensorMode mode = 13 [
    (brewblox.field).readonly = true,
    (brewblox.field).logged = true
  ];
}
