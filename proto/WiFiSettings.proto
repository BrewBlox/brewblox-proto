syntax = "proto3";

import "brewblox.proto";
import "nanopb.proto";

package blox.WiFiSettings;

enum Security {
  WLAN_SEC_UNSEC = 0;
  WLAN_SEC_WEP = 1;
  WLAN_SEC_WPA = 2;
  WLAN_SEC_WPA2 = 3;
  WLAN_SEC_WPA_ENTERPRISE = 4;
  WLAN_SEC_WPA2_ENTERPRISE = 5;
  WLAN_SEC_NOT_SET = 255;
}

enum Cipher {
  WLAN_CIPHER_NOT_SET = 0;
  WLAN_CIPHER_AES = 1;
  WLAN_CIPHER_TKIP = 2;
  WLAN_CIPHER_AES_OR_TKIP = 3;
}

message Block {
  option (brewblox.msg).objtype = WiFiSettings;

  // Read: the network joined, absent while not connected.
  // Write: the network to join, together with the password.
  optional string ssid = 1 [ (nanopb).max_size = 33 ];
  // Write-only, never read back. A write with a password applies ssid,
  // security and cipher with it, absent ones as empty or unsecured; a write
  // without one applies none of them.
  optional string password = 2 [ (nanopb).max_size = 64 ];
  optional Security security = 3;
  optional Cipher cipher = 4;
  // dBm
  int32 signal = 5 [
    (brewblox.field).skip_changed = true,
    (brewblox.field).readonly = true,
    (brewblox.field).logged = true,
    (nanopb).int_size = IS_8
  ];

  // Deprecated fields
  bool ip = 90 [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
}
