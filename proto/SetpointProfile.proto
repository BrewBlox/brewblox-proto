syntax = "proto3";

import "brewblox.proto";
import "nanopb.proto";

package blox.SetpointProfile;

message Point {
  // Offset from start
  uint32 time = 1 [
    (brewblox.field).unit = Second,
    (brewblox.field).stored = true,
    (nanopb).int_size = IS_32
  ];
  // prevent removal of items with time 0 and temp 0 with a oneof
  oneof temperature_oneof {
    int32 temperature = 2 [
      (brewblox.field).unit = Celsius,
      (brewblox.field).scale = 4096,
      (brewblox.field).stored = true,
      (nanopb).int_size = IS_32
    ];
  }
}

message PointList {
  repeated Point items = 1 [ (brewblox.field).stored = true ];
}

message Block {
  option (brewblox.msg).objtype = SetpointProfile;
  option (brewblox.msg).impl = EnablerInterface;

  // Read at load only: blobs from before the wrapper.
  repeated Point pointsLegacy = 1 [ (brewblox.field).ignored = true ];
  PointList points = 8 [ (brewblox.field).stored = true ];
  optional bool enabled = 3 [ (brewblox.field).stored = true ];
  optional uint32 targetId = 4 [
    (brewblox.field).objtype = SetpointSensorPair,
    (brewblox.field).stored = true
  ];
  optional sint32 setting = 5 [
    (brewblox.field).unit = Celsius,
    (brewblox.field).scale = 4096,
    (brewblox.field).logged = true,
    (brewblox.field).logged_decimals = 3,
    (brewblox.field).readonly = true,
    (nanopb).int_size = IS_32
  ];
  optional uint32 start = 6 [
    (brewblox.field).datetime = true,
    (brewblox.field).stored = true,
    (nanopb).int_size = IS_32
  ];

  optional bool interpolateDisabled = 7 [ (brewblox.field).stored = true ];

  // Deprecated field
  bool drivenTargetId = 90
      [ (brewblox.field).ignored = true, (nanopb).type = FT_IGNORE ];
}
